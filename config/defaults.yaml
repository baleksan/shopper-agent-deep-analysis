# Default configuration for shopper-agent-obs-hub-analyze skill.
#
# DO NOT EDIT THIS FILE DIRECTLY.
# To customize, copy this file to:
#     ~/.claude/shopper-agent-obs-hub-analyze.yaml
# and edit that file. The skill overlays your user file on top of these defaults.
#
# Precedence (highest wins):
#   1. Per-query flags the user gives in chat
#   2. ~/.claude/shopper-agent-obs-hub-analyze.yaml  (user override)
#   3. This file (defaults.yaml, ships with the skill)
#
# NOTE: The list of analyses (sub-skills) is NOT defined here. It is
# discovered from the filesystem at runtime by scanning sub-skills/*.md.
# Each sub-skill file declares its own id, label, description, output,
# and optional `upstream:` block in its YAML frontmatter. To add a new
# sub-skill, drop a new file into sub-skills/ — no config edit required.
# See sub-skills/README.md for the full contract.

# Default Splunk stage when the user doesn't specify one.
# Must be one of the keys under `stages:` below.
default_stage: core

# Optional: pre-pick a default sub-skill ID. If unset, the skill always
# shows the menu and waits for the user to choose. Recommended: leave
# unset.
# default_analysis: anomaly

# Where sub-skill files live, relative to the skill folder.
sub_skills_dir: ./sub-skills

# ──────────────────────────────────────────────────────────────────────────────
# Stage definitions.
# Each stage maps to a workflow in a sister skill — the skill never writes its
# own SPL.
# ──────────────────────────────────────────────────────────────────────────────
stages:

  core:
    description: "Core agent runtime b2usg logs (default)"
    sister_skill: shopper-agent-splunk-query
    workflow: "Analyze a specific Bot Session (Core-only deep dive)"
    accepts_session_kinds: [botSessionId, conversationId]
    notes: |
      For a conversationId, the sister skill will first resolve botSessionId
      via SCRT2 (Step 1) before pulling Core. For a botSessionId, it skips
      straight to Step 3.

  scrt2:
    description: "SCRT2 chat layer logs"
    sister_skill: shopper-agent-splunk-query
    workflow: "Step 2 (SCRT2 events) + Step 5-SCRT2 (errors)"
    accepts_session_kinds: [conversationId]
    notes: |
      Requires a conversationId. If the user gave a botSessionId, the skill
      should run the reverse lookup from shopper-agent-trace-visualize Step 1b
      to recover the conversationId first.

  e2e:
    description: "End-to-end (SCRT2 + Core merged)"
    sister_skill: shopper-agent-splunk-query
    workflow: "Full E2E workflow (Steps 1-5)"
    accepts_session_kinds: [conversationId, botSessionId]

  search:
    description: "Search stack logs (Cimulate auto-pull + SCAPI manual paste)"
    sister_skill: null
    splunk_api_base_url: "https://splunk-api-noncore.log-analytics.monitoring.aws-esvc1-useast2.aws.sfdc.cl"
    splunk_base_query: |
      `indexes_for_distapps()` service_group=cimulate environment=qa
        k8s_container_name="cimulate-search-api"
        event_type="http_request_complete" uri="/api/v1/search"
    accepts_session_kinds: [requestId, customer_id]
    notes: |
      Two layers: Cimulate (accessible via MCP) and SCAPI shopper-search (NOT accessible).
      Architecture: Core agent → SCAPI shopper-search → Cimulate search-api.
      Cimulate key fields: customer_id, request_id, latency_ms, status, bytes_out, request_body.
      SCAPI layer (commercecloud-secure) requires manual log paste until RBAC lands in 5b.
      Cimulate Web UI: https://splunk-web-noncore.log-analytics.monitoring.aws-esvc1-useast2.aws.sfdc.cl
      SCAPI Web UI: same host, index=commercecloud-secure

  ux:
    description: "MIAW client UX rows (browser-side state, perf metrics, FailureEvents)"
    sister_skill: shopper-agent-trace-visualize
    workflow: "Step 2 — MIAW Client UX query"
    accepts_session_kinds: [conversationId]

# ──────────────────────────────────────────────────────────────────────────────
# Refresh script defaults (used by scripts/refresh_prompts.sh).
# These are FALLBACKS only — each sub-skill file declares its own
# upstream.repo / upstream.branch / upstream.path in frontmatter, and
# the script prefers per-file values over these globals.
# ──────────────────────────────────────────────────────────────────────────────
refresh_defaults:
  repo: baleksan/obs-hub
  branch: main

# ──────────────────────────────────────────────────────────────────────────────
# Behavior knobs.
# ──────────────────────────────────────────────────────────────────────────────
behavior:
  # When true and the chosen sub-skill has output:json, validate the LLM
  # response is parseable JSON and retry once if not.
  validate_json_output: true
  # When the user picks 'all', ask for confirmation before kicking off N LLM
  # calls.
  confirm_run_all: true
  # Max rows to pass to the LLM in one analysis. Cap to keep prompts inside
  # context windows.
  max_rows_per_analysis: 500

  # ─── Mandatory UX rules (see SKILL.md "Core rules") ─────────────────────
  # Rule 1: Always render the analysis menu when no sub-skill was named.
  # Set false ONLY if you want the skill to silently use default_analysis.
  always_show_menu_on_entry: true
  # Rule 2: Always render the "Splunk Links Used" section in every report.
  # Lists every Splunk query that was run (or skipped) with clickable URLs.
  always_show_splunk_links: true
  # Rule 3: Always render the "What's next?" follow-up menu after results,
  # offering (a) continue with another sub-skill on the same data, or
  # (b) start a new analysis on a different session.
  always_show_whats_next: true

  # When option (a) of "what's next" is picked, reuse the rows we already
  # pulled in-session instead of re-querying Splunk.
  reuse_pulled_rows_on_continue: true
  # Where to cache pulled rows so cross-turn continuation works.
  pulled_rows_cache_dir: ".agents/artifacts"

  # ─── HTML report export (Step 9 in SKILL.md) ────────────────────────────
  # When true, the "What's next?" menu always offers option (c) — export
  # the most recent analysis as a self-contained HTML report.
  offer_html_export_in_whats_next: true
  # Where the renderer writes <sessionId>_<analysisId>.html.
  html_output_dir: ".agents/artifacts"
  # Path to the Python renderer (relative to skill folder).
  html_renderer: "scripts/render_html.py"
  # Path to the HTML template (relative to skill folder).
  html_template: "templates/report.html.tmpl"
